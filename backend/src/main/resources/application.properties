
# ============================================
# MySQL Database Configuration
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/college_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / Hibernate Configuration
# ============================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ============================================
# Server Configuration
# ============================================

server.port=8080


## added after having the uploads folder
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads

# JWT Configuration
app.jwt.secret=CollegeManagementSystemJwtSecretKey2026SecureForAuthentication
app.jwt.expiration=86400000

## $env:DB_PASSWORD="YOUR_MYSQL_PASSWORD"