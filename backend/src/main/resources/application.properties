
# ============================================
# MySQL Database Configuration
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/college_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / Hibernate Configuration
# ============================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ============================================
# Server Configuration
# ============================================

server.port=8080


## added after having the uploads folder
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads


# Email delivery - configure with environment variables


# Email configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:}
app.frontend.url=${FRONTEND_URL:http://172.26.169.215:5173}
app.password-reset-expiry-minutes=15




# JWT Configuration
app.jwt.secret=CollegeManagementSystemJwtSecretKey2026SecureForAuthentication
app.jwt.expiration=86400000


##temporary line for diagnosis
logging.level.org.springframework.security=DEBUG

